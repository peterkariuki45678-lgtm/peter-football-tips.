name: Daily Safe Match Engine
on:
  schedule:
    - cron: '0 5 * * *' # Calculates fresh data every single day at 5 AM
  workflow_dispatch: # Gives you a manual "Run" button inside GitHub Actions
jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - run: python predict.py
    - name: Save Results to Site codebase
      run: |
        git config --global user.name "Engine Bot"
        git config --global user.email "bot@github.com"
        git add predictions.json
        git diff-index --quiet HEAD || git commit -m "Updated algorithmic safe picks" && git push
