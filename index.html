<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peter Football Tips</title>
    <style>
        :root {
            --primary-green: #2e7d32;
            --light-green: #e8f5e9;
            --accent-yellow: #fbc02d;
            --light-yellow: #fffde7;
            --dark-text: #1b5e20;
            --card-bg: #ffffff;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--light-green);
            color: #333;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: var(--primary-green);
            color: var(--accent-yellow);
            padding: 25px 20px;
            text-align: center;
        }
        header h1 { margin: 0; font-size: 2.2rem; }
        header p { margin: 5px 0 0 0; color: #fff; }
        .container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .tool-section {
            background-color: var(--light-yellow);
            border: 2px solid var(--accent-yellow);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .search-box input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
        }
        .search-box button {
            background-color: var(--primary-green);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        #instantResultCard {
            margin-top: 15px;
            background: white;
            border: 2px dashed var(--primary-green);
            border-radius: 8px;
            padding: 15px;
        }
        .best-seven-trigger {
            text-align: center;
            margin: 25px 0;
        }
        .btn-best-7 {
            background-color: var(--accent-yellow);
            color: var(--dark-text);
            border: 2px solid var(--primary-green);
            padding: 15px 40px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
        }
        .section-title {
            color: var(--primary-green);
            border-bottom: 3px solid var(--accent-yellow);
            padding-bottom: 5px;
            margin-top: 30px;
        }
        .match-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }
        .match-card {
            background: var(--card-bg);
            border-radius: 10px;
            border-left: 5px solid var(--primary-green);
            padding: 15px;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .match-card.best-7-card {
            border-left: 5px solid var(--accent-yellow);
            background: #fffdeb;
        }
        .match-teams { font-size: 1.1rem; font-weight: bold; margin: 8px 0; }
        .prediction-badge {
            background: var(--light-green);
            color: var(--primary-green);
            display: inline-block;
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
        }
        .confidence-indicator {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--primary-green);
            color: white;
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .hidden { display: none !important; }
    </style>
</head>
