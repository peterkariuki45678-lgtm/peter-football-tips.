
name: Peter Football Tips Data Update

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "update-predictions.js"
      - ".github/workflows/update.yml"

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: peter-football-tips-update
  cancel-in-progress: false

jobs:
  update-predictions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check updater exists
        run: |
          test -f update-predictions.js || {
            echo "ERROR: update-predictions.js is missing."
            exit 1
          }

      - name: Generate predictions from public football data
        run: node ./update-predictions.js

      - name: Validate generated JSON
        run: |
          test -f predictions.json || {
            echo "ERROR: predictions.json was not created."
            exit 1
          }

          node -e '
            const fs = require("fs");
            const data = JSON.parse(
              fs.readFileSync("predictions.json", "utf8")
            );

            if (!Array.isArray(data)) {
              throw new Error("predictions.json must contain a JSON array.");
            }

            console.log("Predictions file is valid.");
            console.log("Predictions:", data.length);
          '

      - name: Commit updated predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add predictions.json

          if git diff --cached --quiet; then
            echo "No prediction changes to commit."
            exit 0
          fi

          git commit -m "Update football predictions"
          git push origin HEAD:main
