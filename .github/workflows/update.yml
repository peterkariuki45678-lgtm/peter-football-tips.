
name: Peter Football Tips Data Update

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "update-predictions.js"
      - ".github/workflows/update.yml"
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: peter-football-tips-update
  cancel-in-progress: false

jobs:
  update-predictions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify updater exists
        run: |
          if [ ! -f update-predictions.js ]; then
            echo "ERROR: update-predictions.js is missing from the repository root."
            exit 1
          fi

      - name: Run prediction updater
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: node ./update-predictions.js

      - name: Verify predictions file
        run: |
          if [ ! -f predictions.json ]; then
            echo "ERROR: predictions.json was not created."
            exit 1
          fi

          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("predictions.json", "utf8"));
            console.log("Fixtures:", data.totalFixtures);
            console.log("Calculated predictions:", data.totalPredictionsAvailable);
            console.log("Unavailable predictions:", data.totalPredictionsUnavailable);
          '

      - name: Commit and push predictions safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add predictions.json

          if git diff --cached --quiet; then
            echo "No changes to predictions.json."
            exit 0
          fi

          git commit -m "Update football predictions"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
