name: Update Football Predictions

on:
workflow_dispatch:
push:
branches:
- main
schedule:
- cron: "0 */6 * * *"

permissions:
contents: write

jobs:
update-predictions:
runs-on: ubuntu-latest

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4
    with:
      persist-credentials: true

  - name: Set Up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: "20"

  - name: Check API Secret
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
    run: |
      if [ -z "$API_FOOTBALL_KEY" ]; then
        echo "ERROR: API_FOOTBALL_KEY secret is missing or empty."
        exit 1
      fi
      echo "API secret is available."

  - name: Run Probability Calculations Script
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      FOOTBALL_API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
    run: node update_predictions.js

  - name: Commit and Push Updated Predictions
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add predictions.json
      if git diff --cached --quiet; then
        echo "No prediction changes to commit."
      else
        git commit -m "Update football predictions"
        git push
      fi
