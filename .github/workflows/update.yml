name: Update Football Predictions

on:
workflow_dispatch:
push:
branches:
- main
schedule:
- cron: "0 */6 * * *"

permissions:
contents: write

jobs:
update:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      persist-credentials: true

  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: "20"

  - name: Verify API secret
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
    run: |
      if [ -z "$API_FOOTBALL_KEY" ]; then
        
      fi
      echo "API secret detected. Its value will not be displayed."

  - name: Run predictions
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      FOOTBALL_API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
    run: node update_predictions.js

  - name: Save updated predictions
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add -A
      if git diff --cached --quiet; then
        echo "No file changes to commit."
      else
        git commit -m "Update football predictions"
        git push
      fi
