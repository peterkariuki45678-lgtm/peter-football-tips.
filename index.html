<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peter Football Tips</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: white; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        h1 { text-align: center; color: #4CAF50; margin-bottom: 5px; }
        .subtitle { text-align: center; font-size: 0.9rem; color: #888; margin-bottom: 20px; }
        .match-card { background: #1e1e1e; padding: 15px; margin: 15px 0; border-radius: 8px; border-left: 5px solid #4CAF50; display: flex; flex-direction: column; }
        .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .teams { font-size: 1.1rem; font-weight: bold; }
        .prediction-box { background: #2e7d32; padding: 8px 12px; border-radius: 4px; font-weight: bold; text-align: center; min-width: 150px; }
        .probability-bar { display: flex; font-size: 0.8rem; background: #121212; padding: 8px; border-radius: 4px; justify-content: space-around; color: #aaa; }
        .loading { text-align: center; font-style: italic; color: #888; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎯 Peter Football Tips</h1>
    <div class="subtitle">Multi-Platform Statistical Aggregator (Flashscore & Livescore Logic)</div>
    
    <div id="matches-container">
        <p class="loading">Loading compiled multi-platform predictions...</p>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    // Fetches your calculated data directly from your repository asset layer keyless
    fetch('./predictions.json')
        .then(response => response.json())
        .then(matches => {
            const container = document.getElementById("matches-container");
            container.innerHTML = ""; 

            if (matches.length === 0) {
                container.innerHTML = `<p class="loading">No open matches analyzed for today yet. Check back shortly!</p>`;
                return;
            }

            matches.forEach(match => {
                const matchHtml = `
                    <div class="match-card">
                        <div class="card-top">
                            <div>
                                <span class="teams">${match.homeTeam} vs ${match.awayTeam}</span>
                                <span class="league">🏆 Aggregated Sure Line</span>
                            </div>
                            <div class="prediction-box">
                                <span style="font-size:0.75rem; display:block; font-weight:normal; opacity:0.8;">SURE PICK</span>
                                ${match.tip} <br>
                                <span style="font-size:0.7rem; color:#bfdbfe; font-weight:normal;">Confidence: ${match.confidence}</span>
                            </div>
                        </div>
                        <div class="probability-bar">
                            <span>🏠 Home Strength: <strong style="color:#4CAF50">${match.homePercent}</strong></span>
                            <span>🤝 Draw Factor: <strong style="color:#ffb300">${match.drawPercent}</strong></span>
                            <span>🚀 Away Strength: <strong style="color:#2196F3">${match.awayPercent}</strong></span>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML("beforeend", matchHtml);
            });
        })
        .catch(error => {
            console.error("Error reading file layer:", error);
            document.getElementById("matches-container").innerHTML = `<p class="loading" style="color: #ff5252;">Predictions file compilation processing. Please refresh in a moment.</p>`;
        });
});
</script>

</body>
</html>
