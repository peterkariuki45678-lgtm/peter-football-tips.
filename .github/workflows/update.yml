name: Peter Football Tips Data Update

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Run Probability Calculations Script
      run: node update_predictions.js

    - name: Commit and Push Generated Predictions
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        git add predictions.json
        git diff-index --quiet HEAD || git commit -m "Automated update of safe match tips"
        git push
