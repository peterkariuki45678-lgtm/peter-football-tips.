name: Daily Football Prediction Engine

on:
  schedule:
    # This triggers the robot automatically every day at 00:00 UTC (Midnight)
    - cron: '0 0 * * *'
  workflow_dispatch:
    # This allows you to manually run the script anytime by clicking a button on GitHub

jobs:
  run-scraper-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial: Allows the runner to save changes back to your repo

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set Up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Scraping Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pandas numpy

    - name: Execute Prediction Math & Scraper Pipeline
      run: |
        python scraper_pipeline.py

    - name: Commit and Push Updated Predictions
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        
        # Check if the predict.json data changed today
        git add predict.json
        if git diff --staged --quiet; then
          echo "No new prediction data changes calculated today."
        else
          git commit -m "Automated Daily Refresh: $(date +'%Y-%m-%d') [Skip CI]"
          git push
        fi
