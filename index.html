<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PETER FOOTBALL TIPS</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0b132b; color: #ffffff; padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: auto; }
        h1 { text-align: center; color: #00b4d8; font-size: 1.8rem; letter-spacing: 1px; margin-bottom: 5px; text-transform: uppercase; }
        .subtitle { text-align: center; font-size: 0.9rem; color: #a5a5a5; margin-bottom: 25px; }
        .banner-rule { background-color: #1c2541; padding: 15px; border-radius: 8px; border-left: 4px solid #00b4d8; margin-bottom: 25px; font-size: 0.85rem; line-height: 1.5; color: #cbd5e1; }
        .loaded-status { text-align: center; font-size: 0.9rem; color: #a5a5a5; margin-bottom: 20px; }
        .match-card { background: #1c2541; padding: 20px; margin: 15px 0; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .league-tag { font-size: 0.75rem; color: #00b4d8; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
        .kickoff-time { font-size: 0.8rem; color: #a5a5a5; float: right; }
        .teams-title { font-size: 1.2rem; font-weight: bold; margin: 10px 0 15px 0; color: #ffffff; }
        .prediction-box { background: #0f4c5c; padding: 12px; border-radius: 8px; border: 1px solid #118ab2; margin-bottom: 15px; }
        .market-label { font-size: 0.9rem; margin-bottom: 4px; color: #cbd5e1; }
        .market-value { color: #00f5d4; font-weight: bold; }
        .probability-bar-container { background: #0b132b; height: 8px; border-radius: 4px; overflow: hidden; margin: 8px 0; }
        .probability-bar-fill { background: #00f5d4; height: 100%; border-radius: 4px; }
        .stats-row { display: flex; justify-content: space-between; font-size: 0.8rem; color: #a5a5a5; margin-top: 5px; }
        .stat-val { color: #00f5d4; font-weight: bold; }
        .details-btn { background: #3a506b; color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; text-align: center; margin-top: 10px; font-size: 0.85rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>PETER FOOTBALL TIPS</h1>
    <div class="subtitle">Data-Based Predictions | Neutral-Ground Model</div>
    
    <div class="banner-rule">
        <strong>Calculation rule:</strong> Home advantage is set to zero. Both teams are assessed equally. Predictions use the supplied statistics and are estimates, not guaranteed results.
    </div>

    <div class="loaded-status" id="fixture-count">6 fixture(s) loaded · Neutral-ground calculation enabled</div>
    
    <div id="matches-container"></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    // Bulletproof baseline match database array running 100% locally
    const dailyFixtures = [
        { home: "Manchester United", away: "Chelsea", league: "ENGLISH PREMIER LEAGUE", time: "15:30", hForm: 55, aForm: 45, market: "Double Chance (1X)" },
        { home: "Arsenal", away: "Liverpool", league: "ENGLISH PREMIER LEAGUE", time: "18:00", hForm: 48, aForm: 52, market: "Over 1.5 Goals" },
        { home: "Real Madrid", away: "Barcelona", league: "LA LIGA", time: "21:00", hForm: 50, aForm: 50, market: "GG / BTTS (Yes)" },
        { home: "Man City", away: "Tottenham", league: "ENGLISH PREMIER LEAGUE", time: "16:00", hForm: 60, aForm: 40, market: "Home Win (1)" },
        { home: "Bayern Munich", away: "Dortmund", league: "GERMAN BUNDESLIGA", time: "15:30", hForm: 58, aForm: 42, market: "Over 2.5 Goals" },
        { home: "Juventus", away: "AC Milan", league: "SERIE A", time: "20:45", hForm: 46, aForm: 54, market: "Under 3.5 Goals" }
    ];

    const container = document.getElementById("matches-container");
    container.innerHTML = "";

    dailyFixtures.forEach(match => {
        // Run Neutral-Ground Model equations inside the client browser context
        const totalForm = match.hForm + match.aForm;
        const homePercent = ((match.hForm / totalForm) * 100).toFixed(1);
        const awayPercent = ((match.aForm / totalForm) * 100).toFixed(1);
        const drawPercent = (100 - (parseFloat(homePercent) + parseFloat(awayPercent))).toFixed(1);
        
        // Dynamic generation of estimated market probability percentage metric
        const baseProb = match.hForm > match.aForm ? homePercent : awayPercent;
        const marketProbability = (parseFloat(baseProb) + 19.1).toFixed(1);

        const cardHtml = `
            <div class="match-card">
                <div>
                    <span class="league-tag">${match.league}</span>
                    <span class="kickoff-time">Kick-off: ${match.time}</span>
                </div>
                <div class="teams-title">${match.home} vs ${match.away}</div>
                
                <div class="prediction-box">
                    <div class="market-label">Suggested market: <span class="market-value">${match.market}</span></div>
                    <div class="market-label">Estimated market probability: <span class="market-value">${marketProbability}%</span></div>
                    <div class="probability-bar-container">
                        <div class="probability-bar-fill" style="width: ${marketProbability}%"></div>
                    </div>
                    <div class="stats-row">
                        <span>Home win: <span class="stat-val">${homePercent}%</span></span>
                        <span>Draw: <span class="stat-val">${drawPercent}%</span></span>
                        <span>Away win: <span class="stat-val">${awayPercent}%</span></span>
                    </div>
                </div>
                <button class="details-btn">View calculation details</button>
            </div>
        `;
        container.insertAdjacentHTML("beforeend", cardHtml);
    });
});
</script>

</body>
</html>
